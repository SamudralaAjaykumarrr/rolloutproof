apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    rolloutproof.dev/service: payments
    rolloutproof.dev/version: build-9012
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: registry.example.com/payments:build-9012
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    rolloutproof.dev/service: checkout
    rolloutproof.dev/version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: registry.example.com/checkout:v1
