apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    rolloutproof.dev/service: api
    rolloutproof.dev/version: v2
  annotations:
    rolloutproof.dev/depends-on: "auth"
    rolloutproof.dev/waits-on-dependencies: "true"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.example.com/api:v2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    rolloutproof.dev/service: auth
    rolloutproof.dev/version: v2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: registry.example.com/auth:v2
