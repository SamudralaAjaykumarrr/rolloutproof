apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    rolloutproof.dev/service: orders
    rolloutproof.dev/version: v2
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: registry.example.com/orders:v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    rolloutproof.dev/service: checkout
    rolloutproof.dev/version: v1
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: registry.example.com/checkout:v1
